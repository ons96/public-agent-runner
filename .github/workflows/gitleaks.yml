name: Gitleaks Secret Scanning
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  gitleaks:
    # GitHub names the check after the job, and this job published lowercase
    # "gitleaks" while branch protection requires "Gitleaks" - so no run could
    # ever satisfy it and every PR here sat BLOCKED.
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicit path: gitleaks only auto-detects a root-level .gitleaks.toml.
          GITLEAKS_CONFIG: .gitleaks/config.toml